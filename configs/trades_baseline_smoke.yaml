# Smoke config for train_trades.py — verifies the baseline pipeline end-to-end
# in ~1 min on an RTX 3050 Mobile. Production analogue: configs/trades_baseline.yaml.
# Reductions: epochs 40->1, val_size 1000->256, inner PGD 5->2, val PGD 20->5.

run_id: trades_baseline_smoke
output_dir: runs
seed: 0

data:
  data_root: ./data
  batch_size: 64
  val_size: 256
  num_workers: 0       # avoid Windows multiprocessing flakes on smoke
  download: true

model:
  num_classes: 10

train:
  epochs: 1
  optimizer:
    lr: 0.1
    momentum: 0.9
    nesterov: true
    weight_decay: 5.0e-4
  lr_schedule:
    type: multistep
    milestones: [10]   # past the run end -> no actual decay during smoke
    gamma: 0.1
  amp: true

attack:
  train_inner:
    eps: 0.03137254901960784   # 8/255
    alpha: 0.00784313725490196 # 2/255
    steps: 2                   # smoke-fast (production: 5)
    objective: kl_to_clean
    random_start: true
  val_pgd20:
    eps: 0.03137254901960784
    alpha: 0.00784313725490196
    steps: 5                   # smoke-fast (production: 20)
    objective: ce
    random_start: true

loss:
  trades_beta: 6.0
